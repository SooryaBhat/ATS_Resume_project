<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="talentmatch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#talentmatch-grad)"/>
  <!-- Resume Page Outline -->
  <rect x="22" y="20" width="40" height="56" rx="6" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>
  <!-- Text lines on Resume -->
  <line x1="30" y1="32" x2="52" y2="32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <line x1="30" y1="42" x2="48" y2="42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <line x1="30" y1="52" x2="44" y2="52" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- AI Sparkle / Star Overlay -->
  <path d="M68 28 L72 40 L84 44 L72 48 L68 60 L64 48 L52 44 L64 40 Z" fill="#FDE047" filter="url(#glow)"/>
  <path d="M42 66 L44 72 L50 74 L44 76 L42 82 L40 76 L34 74 L40 72 Z" fill="#67E8F9"/>
</svg>
